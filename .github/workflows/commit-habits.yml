name: Commit habits

on:
  schedule:
    - cron: '47 23 * * *' # 04:47 Tashkent
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'mehroj-r/mehroj-r'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          # Full history, so publish_single_commit.sh can tell whether it is already one commit.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Run tests
        run: python3 -m unittest discover -s tests

      # USER_TOKEN (classic PAT: read:user, repo) adds private repositories. Commits already in
      # data/commit-habits.json keep counting even when a repository is no longer readable.
      # The script prints counts only, never repository names, because these logs are public.
      - name: Count commit habits
        env:
          GITHUB_TOKEN: ${{ secrets.USER_TOKEN || github.token }}
        run: python3 scripts/commit_habits.py --username mehroj-r --timezone Asia/Tashkent

      - name: Publish as the repository's only commit
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          git add -- README.md data/commit-habits.json images/owners
          bash scripts/publish_single_commit.sh "$DEFAULT_BRANCH"
